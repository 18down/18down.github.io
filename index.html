    <!-- THE SIX DOORS.
         This is the whole home page: the logo, one line, and these. Each tile
         is a picture, a link and a caption, and nothing else.

         To change one, edit its <a>: the href, the picture, and the words in
         the <span>. To change the ORDER, move the whole <li>. The pictures
         live in assets/img/tiles/ and are 16:9 -- crop a replacement to the
         same shape or it will not match its neighbours.

         The caption is what a screen reader and a search engine read, so it
         also serves as the picture's description; that is why the <img> has
         an empty alt rather than a repeat of the same words. -->
